<title>Tryout PK dan PM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;600;700&family=Space+Mono:wght@700&display=swap">
<style>
/* Gaya: lembar ujian + stiker. Kertas krem, garis tebal tinta, bayangan keras, bulatan jawaban ala LJK. PK biru, PM merah muda, kuning = penanda. */
:root{
  --paper:#FFF5DB; --card:#FFFDF5; --ink:#1B1840; --muted:#5F5A85;
  --blue:#3E5CFF; --on-blue:#FFFFFF; --pink:#FF6B9A; --yellow:#FFD233; --mint:#3FD69A; --lilac:#CDBDFF;
  --hl:#FFE98A; --good-soft:#C9F5E1; --bad-soft:#FFD3E1; --good:#0A8F5F; --bad:#D62A5C;
  --sh:#1B1840; --on-y:#1B1840; --fig:#FFFFFF;
  --disp:'Bricolage Grotesque',Georgia,'Times New Roman',serif;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15122B; --card:#201C3E; --ink:#FFF3D6; --muted:#B5B0DA;
    --blue:#7D94FF; --on-blue:#0F0C2A; --pink:#FF86AD; --yellow:#FFD233; --mint:#3FD69A; --lilac:#8E7BE0;
    --hl:#4B4014; --good-soft:#12402F; --bad-soft:#4A1730; --good:#4BE3A6; --bad:#FF8FB0;
    --sh:#05030F; --on-y:#1B1840; --fig:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15122B; --card:#201C3E; --ink:#FFF3D6; --muted:#B5B0DA;
  --blue:#7D94FF; --on-blue:#0F0C2A; --pink:#FF86AD; --yellow:#FFD233; --mint:#3FD69A; --lilac:#8E7BE0;
  --hl:#4B4014; --good-soft:#12402F; --bad-soft:#4A1730; --good:#4BE3A6; --bad:#FF8FB0;
  --sh:#05030F; --on-y:#1B1840; --fig:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:600 16px/1.6 var(--font);min-height:100vh;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1.2px,transparent 1.3px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:40}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.sp{flex:1 1 auto}
.mono{font-family:var(--mono)}
.disp{font-family:var(--disp)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:3px solid var(--ink)}
.bar{display:flex;align-items:center;gap:10px;min-height:66px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font:800 22px var(--disp);letter-spacing:-.02em}
.mark{width:40px;height:40px;border-radius:10px;background:var(--yellow);color:var(--on-y);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--sh);display:grid;place-items:center;font:800 22px var(--disp);transform:rotate(-6deg)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:3px solid transparent;background:none;padding:6px 16px;border-radius:999px;font-weight:700}
.tab:hover{border-color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--disp);padding:3px 12px;border-radius:999px;border:2.5px solid var(--ink);background:var(--blue);color:var(--on-blue);letter-spacing:.01em;white-space:nowrap}
.chip.pm{background:var(--pink);color:#1B1840}
.chip.soft{background:var(--card);color:var(--ink)}
.timer{font:700 24px var(--mono);padding:2px 14px;border-radius:12px;background:var(--ink);color:var(--paper);min-width:104px;text-align:center;letter-spacing:.02em;border:3px solid var(--ink)}
.timer.warn{background:var(--yellow);color:var(--on-y)}
.timer.crit{background:var(--pink);color:#1B1840}
.prog{height:12px;background:var(--card);border-top:3px solid var(--ink)}
.prog i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--blue) 0 8px,color-mix(in srgb,var(--blue) 70%,#fff) 8px 16px);border-right:3px solid var(--ink);transition:width 1s linear}

/* buttons */
.btn{border:3px solid var(--ink);border-radius:14px;padding:11px 22px;font:800 16px var(--disp);background:var(--yellow);color:var(--on-y);box-shadow:4px 4px 0 var(--sh);text-align:center;transition:transform .08s,box-shadow .08s;letter-spacing:.01em}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:12px;box-shadow:3px 3px 0 var(--sh)}
.btn.blue{background:var(--blue);color:var(--on-blue)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.danger{background:var(--pink);color:#1B1840}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--sh)}
.navtoggle{display:none}

/* beranda */
.hero{padding:40px 0 10px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:30px;align-items:center}
.stk{display:inline-block;font:800 14px var(--disp);background:var(--lilac);color:#1B1840;border:2.5px solid var(--ink);border-radius:8px;padding:2px 12px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--sh);letter-spacing:.03em;text-transform:uppercase}
h1{font:800 clamp(38px,7vw,72px)/.98 var(--disp);letter-spacing:-.035em;margin:18px 0 16px;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 58%,var(--yellow) 58% 92%,transparent 92%);color:inherit;padding:0 4px;margin:0 -4px}
.lead{font-size:18px;max-width:46ch;color:var(--muted)}
.statpile{position:relative;height:210px}
.stat{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--sh);padding:10px 20px}
.stat b{display:block;font:800 52px/1 var(--disp);letter-spacing:-.04em}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat.s1{left:0;top:6px;transform:rotate(-4deg);background:var(--yellow);color:var(--on-y)}
.stat.s1 span{color:var(--on-y)}
.stat.s2{right:0;top:92px;transform:rotate(3deg)}
.resume{margin-top:26px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;background:var(--hl);border:3px dashed var(--ink);border-radius:18px;padding:14px 18px}
.resume b{font-family:var(--disp)}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:30px;margin:44px 0 34px}
.subj{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--sh);display:flex;flex-direction:column;min-width:0}
.subj:nth-child(1){transform:rotate(-.6deg)}
.subj:nth-child(2){transform:rotate(.6deg)}
.subj-head{position:relative;padding:20px 22px 16px;background:var(--blue);color:var(--on-blue);border-bottom:3px solid var(--ink);border-radius:18px 18px 0 0;z-index:1}
.subj.pm .subj-head{background:var(--pink);color:#1B1840}
.mono-big{font:800 96px/.85 var(--disp);letter-spacing:-.06em}
.subj-head h2{font:800 22px/1.15 var(--disp);letter-spacing:-.01em;margin-top:8px}
.subj-head p{font-size:14px;font-weight:700;opacity:.9}
.bubbles{position:absolute;right:16px;top:18px;display:grid;gap:6px;grid-template-columns:repeat(5,22px)}
.bubbles i{width:22px;height:22px;border-radius:50%;border:2.5px solid currentColor;display:block}
.bubbles i.f{background:currentColor}
.badge{z-index:2;position:absolute;right:18px;bottom:-16px;transform:rotate(4deg);background:var(--yellow);color:var(--on-y);border:3px solid var(--ink);border-radius:10px;padding:2px 12px;font:800 15px var(--disp);box-shadow:3px 3px 0 var(--sh)}
.subj-body{padding:26px 22px 24px;display:flex;flex-direction:column;gap:18px;flex:1}
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.triple div{border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;background:var(--paper)}
.triple b{display:block;font:800 30px/1.1 var(--disp);letter-spacing:-.03em}
.triple span{font-size:12px;color:var(--muted);font-weight:700}
.spark{display:block;width:100%;height:auto;max-height:80px}
.empty-spark{border:2.5px dashed var(--ink);border-radius:12px;padding:14px;color:var(--muted);font-size:14px;text-align:center}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin:8px 0 50px}
.rule{border:3px solid var(--ink);border-radius:16px;padding:14px 16px;background:var(--card);font-size:15px;color:var(--muted)}
.rule:nth-child(1){background:color-mix(in srgb,var(--yellow) 35%,var(--card))}
.rule:nth-child(2){background:color-mix(in srgb,var(--mint) 30%,var(--card))}
.rule:nth-child(3){background:color-mix(in srgb,var(--lilac) 40%,var(--card))}
.rule b{display:block;color:var(--ink);font:800 18px var(--disp);margin-bottom:2px}

/* ujian + review */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start;padding:26px 0 56px}
.qcard{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:26px 26px 24px;box-shadow:7px 7px 0 var(--sh);min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.qnum{display:flex;align-items:baseline;gap:8px;font:800 44px/1 var(--disp);letter-spacing:-.04em}
.qnum small{font:800 15px var(--font);color:var(--muted);letter-spacing:0}
.ctx{background:var(--hl);border:2.5px solid var(--ink);border-radius:14px;padding:12px 16px 14px;margin-bottom:18px;font-size:15px;font-weight:600;min-width:0;position:relative}
.ctx p+p{margin-top:8px}
.ctxlab{display:inline-block;font:800 13px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:0 10px;border-radius:6px;margin-bottom:8px}
.qtext{font-size:17.5px;line-height:1.65}
.qtext+.qtext{margin-top:10px}
.qtext i{font-family:Georgia,'Times New Roman',serif;font-size:1.05em}
.stmts{list-style:none;padding:0;margin:10px 0 0;counter-reset:s;display:grid;gap:4px}
.stmts li{counter-increment:s;padding-left:36px;position:relative}
.stmts li::before{content:"(" counter(s) ")";position:absolute;left:0;font-weight:800;color:var(--muted)}
.tw{overflow-x:auto;margin-top:10px}
table.qt,table.dt{border-collapse:collapse;font-size:14px;min-width:min(100%,260px);background:var(--card)}
table.qt th,table.qt td,table.dt th,table.dt td{border:2px solid var(--ink);padding:5px 12px;text-align:center}
table.qt th,table.dt th{background:var(--paper);font-weight:800}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-size:.92em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.figbox{display:block;width:fit-content;max-width:100%;margin:16px auto 6px;background:var(--fig);border:2.5px solid var(--ink);border-radius:12px;padding:8px;box-shadow:3px 3px 0 var(--sh)}
.figbox img{display:block;max-width:100%;max-height:340px;width:auto;height:auto;margin:0 auto}
.figrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.figrow .figbox{margin:12px 0 4px}
.opts{display:grid;gap:12px;margin-top:20px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--card);min-width:0;font-weight:600;transition:transform .08s,box-shadow .08s}
.opt .let{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--disp);background:var(--card);border:3px solid var(--ink)}
.opt .tx{padding-top:3px;min-width:0;overflow-wrap:anywhere}
button.opt:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--sh)}
.opt[aria-checked="true"]{background:var(--hl);box-shadow:4px 4px 0 var(--sh);transform:translate(-2px,-2px)}
.opt[aria-checked="true"] .let{background:var(--ink);color:var(--paper)}
.opt.ok{background:var(--good-soft)}
.opt.ok .let{background:var(--good);border-color:var(--ink);color:#fff}
.opt.no{background:var(--bad-soft)}
.opt.no .let{background:var(--bad);color:#fff}
.tag{margin-left:auto;font:800 12px var(--disp);letter-spacing:.05em;text-transform:uppercase;padding:1px 9px;border-radius:6px;background:var(--ink);color:var(--paper);white-space:nowrap;align-self:center}
.tf{margin-top:20px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
.tfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 14px;align-items:center;border-top:3px solid var(--ink)}
.tfrow:first-child{border-top:0}
.tfbtns{display:flex;gap:8px}
.pill{border:3px solid var(--ink);background:var(--card);border-radius:999px;padding:3px 14px;font:800 14px var(--disp);white-space:nowrap}
button.pill:hover{background:var(--hl)}
.pill[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.pill.ok{background:var(--good);color:#fff}
.pill.no{background:var(--bad);color:#fff}
.pill.key{border-style:dashed;color:var(--good)}
.qfoot{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:26px;flex-wrap:wrap}
.flagbtn[aria-pressed="true"]{background:var(--pink);color:#1B1840}
.exp{margin-top:22px;background:var(--hl);border:3px solid var(--ink);border-radius:14px;padding:14px 18px;position:relative}
.exp h4{display:inline-block;font:800 13px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:0 10px;border-radius:6px;margin-bottom:6px}
.navp{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--sh);padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}
.navp h3{font:800 18px var(--disp);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.navp h3 span{font:700 13px var(--font)}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nb{aspect-ratio:1;border-radius:10px;border:2.5px solid var(--ink);background:var(--card);font:800 16px var(--disp);position:relative;padding:0}
.nb:hover{background:var(--hl)}
.nb.ans{background:var(--blue);color:var(--on-blue)}
.nb.cur{background:var(--yellow);color:var(--on-y);box-shadow:3px 3px 0 var(--sh);transform:translate(-1px,-1px)}
.nb.flag::after{content:"";position:absolute;top:-7px;right:-7px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2.5px solid var(--ink)}
.nb.ok{background:var(--good-soft);color:var(--ink)}
.nb.no{background:var(--bad-soft);color:var(--ink)}
.nb.cur.ok,.nb.cur.no{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;font-size:13px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);vertical-align:-2px;margin-right:5px;background:var(--card)}
.legend i.a{background:var(--blue)}
.legend i.f{background:var(--pink);border-radius:50%}
.legend i.g{background:var(--good-soft)}
.legend i.r{background:var(--bad-soft)}
.navp .btn{width:100%;margin-top:18px}
.scrim{position:fixed;inset:0;background:rgba(10,8,40,.55);z-index:44}

/* hasil */
.result{padding:40px 0 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.score{position:relative;width:250px;height:250px;border-radius:50%;background:var(--yellow);color:var(--on-y);border:4px solid var(--ink);box-shadow:9px 9px 0 var(--sh);display:grid;place-items:center;text-align:center;align-content:center}
.score b{font:800 120px/.9 var(--disp);letter-spacing:-.07em;display:block}
.score span{font:800 15px var(--disp);display:block;margin-top:4px}
.score .stamp{position:absolute;right:-26px;top:-4px;transform:rotate(12deg);background:var(--pink);color:#1B1840;border:3px solid var(--ink);border-radius:8px;padding:0 10px;font:800 15px var(--disp);box-shadow:3px 3px 0 var(--sh);text-transform:uppercase;letter-spacing:.04em}
.result h1{font-size:clamp(34px,5.5vw,56px);margin:12px 0 14px}
.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:20px 0}
.rtile{border:3px solid var(--ink);border-radius:14px;padding:6px 14px 8px;background:var(--card);box-shadow:4px 4px 0 var(--sh)}
.rtile b{display:block;font:800 36px/1.1 var(--disp);letter-spacing:-.03em}
.rtile span{font-size:13px;font-weight:700;color:var(--muted)}
.rtile.g{background:var(--good-soft)}.rtile.r{background:var(--bad-soft)}
.delta{display:inline-block;font:800 15px var(--disp);padding:2px 12px;border-radius:8px;background:var(--card);border:2.5px solid var(--ink)}
.delta.up{background:var(--good-soft)}
.delta.down{background:var(--bad-soft)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}

/* riwayat */
.page-head{padding:40px 0 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.page-head h1{font-size:clamp(34px,5vw,56px);margin:10px 0 0}
.seg{display:inline-flex;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:2px 18px;border-radius:999px;font:800 15px var(--disp)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:20px;margin-bottom:24px;box-shadow:7px 7px 0 var(--sh)}
.panel h2{font:800 24px var(--disp);letter-spacing:-.02em;margin-bottom:10px}
.chart{display:block;width:100%;height:auto;color:var(--ink)}
.chart .gl{stroke:var(--ink);stroke-opacity:.25;stroke-width:1.5;stroke-dasharray:3 5}
.chart .ax{fill:var(--muted);font:800 12px var(--font)}
.chart .vl{font:800 14px var(--disp);stroke:var(--card);stroke-width:5px;paint-order:stroke}
.key{display:flex;gap:16px;flex-wrap:wrap;font:800 14px var(--disp);margin-top:6px}
.key i{display:inline-block;width:16px;height:16px;border:2.5px solid var(--ink);border-radius:4px;vertical-align:-3px;margin-right:6px}
.hlist{display:grid;gap:14px;margin-bottom:28px}
.hitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;width:100%;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px 18px;box-shadow:5px 5px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.hitem:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--sh)}
.hitem .t{font:800 19px var(--disp)}
.hitem .s{font-size:14px;color:var(--muted);font-weight:600}
.hitem .sc{font:800 44px/1 var(--disp);letter-spacing:-.04em;text-align:right}
.hitem .sc small{display:block;font:700 12px var(--font);color:var(--muted);letter-spacing:0;margin-top:2px}
.emptybox{border:3px dashed var(--ink);border-radius:20px;padding:44px 20px;text-align:center;color:var(--muted);background:var(--card)}
.emptybox b{display:block;color:var(--ink);font:800 24px var(--disp);margin-bottom:6px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,8,40,.6);display:grid;place-items:center;z-index:60;padding:16px}
.dialog{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:26px;max-width:460px;width:100%;box-shadow:8px 8px 0 var(--sh)}
.dialog h3{font:800 28px/1.1 var(--disp);letter-spacing:-.02em;margin-bottom:10px}
.dialog p{color:var(--muted);margin-bottom:6px}
.dialog .actions{margin-top:20px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:12px;font-weight:800;z-index:70;max-width:calc(100% - 32px);text-align:center;border:3px solid var(--ink)}

@media (max-width:900px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .navtoggle{display:inline-block}

{t:'Pada gambar persegi <i>ABCD</i> berikut, dua garis diagonal <i>w</i> membagi daerah persegi menjadi tiga daerah yang luasnya sama. Jika <i>AB</i> = 3, panjang <i>w</i> sama dengan …',fig:'f1',o:['2√3','√6','√2','3√2','2√3 − √6'],k:0,e:'Luas persegi = 9, jadi tiap daerah luasnya 3. Dua segitiga siku-siku sama kaki di sudut <i>B</i> dan <i>D</i> masing-masing luasnya 3, sehingga ½·<i>s</i>² = 3 dan <i>s</i> = √6. Garis <i>w</i> adalah sisi miringnya: <i>w</i> = √6 · √2 = 2√3.'},
{t:'Segitiga <i>ABE</i> dan segitiga <i>BDC</i> sebangun. Jika titik <i>C</i>(<i>p</i>, <i>q</i>), maka <i>p</i> + <i>q</i> sama dengan …',fig:'f2',o:['9','10','11','12','13'],k:4,e:'<i>AE</i> = 14 − 2 = 12 dan <i>AB</i> = 5 − 1 = 4, sehingga <i>AE</i> : <i>AB</i> = 3 : 1. <i>BD</i> = 5 − 3 = 2, maka <i>BC</i> = 3 × 2 = 6. Titik <i>C</i> = (5, 8), jadi <i>p</i> + <i>q</i> = 13.'},
{t:'Segitiga <i>ABE</i> dan segitiga <i>BDC</i> sebangun. Jika titik <i>C</i>(<i>p</i>, <i>q</i>), maka luas segitiga <i>BCD</i> sama dengan …',fig:'f2',o:['3','6','9','12','15'],k:1,e:'<i>BD</i> = 2 dan <i>BC</i> = 6 (dari kesebangunan), maka luas = ½ · 2 · 6 = 6.'},
{t:'Segitiga <i>ABE</i> dan segitiga <i>BDC</i> sebangun. Jika titik <i>C</i>(<i>p</i>, <i>q</i>), maka panjang sisi <i>CD</i> sama dengan …',fig:'f2',o:['5√2','2√5','2√10','10√2','5'],k:2,e:'<i>D</i>(3, 2) dan <i>C</i>(5, 8): <i>CD</i> = √(2² + 6²) = √40 = 2√10.'},
{t:'Jika <i>A</i> memenuhi 12 : <i>A</i> × 2 = 2, maka nilai <i>A</i> = …',o:['12','6','3','1','4'],k:0,e:'12 : <i>A</i> × 2 = 2 → (12/<i>A</i>) × 2 = 2 → 12/<i>A</i> = 1 → <i>A</i> = 12.'},
{t:'Jika (1 − '+fr(1,2)+') × (1 − '+fr(1,3)+') × (1 − '+fr(1,4)+') … (1 − '+fr(1,2026)+') = '+fr('<i>a</i>','<i>b</i>')+', nilai dari <i>a</i> + <i>b</i> adalah …',o:['2023','2024','2025','2026','2027'],k:4,e:'Tiap suku (1 − 1/<i>n</i>) = (<i>n</i> − 1)/<i>n</i>, sehingga hasilnya berupa teleskop: ½ × ⅔ × ¾ × … × <sup>2025</sup>⁄<sub>2026</sub> = <sup>1</sup>⁄<sub>2026</sub>. Maka <i>a</i> + <i>b</i> = 1 + 2026 = 2027.'},
{t:'Nilai (0,01)²(0,014) + (0,01)(0,0026) = …',o:['0,0000166','0,0000274','0,00004','0,000166','0,0004'],k:1,e:'(0,0001)(0,014) = 0,0000014 dan (0,01)(0,0026) = 0,000026. Jumlahnya 0,0000274.'},
{t:'Perhatikan gambar di bawah ini. Jika <i>O</i> adalah titik pusat lingkaran, maka besar sudut <i>PQR</i> = …',fig:'f8',o:['120°','60°','90°','30°','45°'],k:4,e:'∠<i>QPR</i> = 60° mencakup busur <i>QR</i>, jadi busur <i>QR</i> = 120°. ∠<i>OQP</i> = 15° → ∠<i>OPQ</i> = 15° sehingga ∠<i>POQ</i> = 150° (busur <i>PQ</i> = 150°). Busur <i>PR</i> = 360° − 120° − 150° = 90°, maka ∠<i>PQR</i> = ½ · 90° = 45°.'},
{t:'Untuk bilangan bulat <i>a</i>, <i>b</i>, dan <i>c</i> didefinisikan [<i>a</i>, <i>b</i>, <i>c</i>] = 2<i>a</i> × (<i>b</i> − <i>c</i>). Nilai dari [3, 4, −5] = …',o:['56','6','−3','54','−6'],k:3,e:'2 · 3 × (4 − (−5)) = 6 × 9 = 54.'},
{t:'Perhatikan gambar berikut! <i>PQ</i>, <i>TU</i>, dan <i>SR</i> sejajar. Jika <i>SR</i> = 72, <i>TU</i> = 16, dan <i>T</i> tengah-tengah <i>SQ</i>, maka <i>PQ</i> = …',fig:'f10',o:['18','20','30','40','46'],k:3,e:'Garis <i>PR</i> dan <i>QS</i> berpotongan di <i>X</i>. Karena <i>PQ</i> ∥ <i>SR</i>, segitiga <i>XPQ</i> ∼ <i>XRS</i> sehingga <i>PQ</i> : 72 = <i>XQ</i> : <i>XS</i>. Misal <i>XS</i> = 9<i>k</i> dan <i>XQ</i> = 5<i>k</i>; maka <i>SQ</i> = 14<i>k</i>, <i>ST</i> = 7<i>k</i>, dan <i>XT</i> = 2<i>k</i>. Segitiga <i>XTU</i> ∼ <i>XSR</i> dengan perbandingan 2 : 9, sehingga <i>TU</i> = 72 × 2/9 = 16 ✓ (cocok dengan data). Jadi <i>PQ</i> = 72 × 5/9 = 40.'},
{t:'Perhatikan gambar di bawah ini! Jika <i>q</i> = 72°, maka nilai <i>p</i> = …',fig:'f11',o:['38°','58°','41°','51°','48°'],k:2,e:'<i>q</i> adalah sudut luar di puncak, sehingga sudut dalam puncak = 180° − 72° = 108°. Jumlah dua sudut alas = 72°: <i>p</i> + (<i>p</i> − 10°) = 72° → <i>p</i> = 41°.'},
{t:'Perhatikan gambar berikut! Jika <i>q</i> = 72°, maka nilai <i>r</i> − <i>p</i> = …',fig:'f11',o:['82°','98°','108°','118°','78°'],k:2,e:'Dari soal sebelumnya <i>p</i> = 41°. Sudut dalam di kanan = 31°, maka <i>r</i> = 180° − 31° = 149°. Jadi <i>r</i> − <i>p</i> = 149° − 41° = 108°.'},
{t:'Perhatikan gambar berikut! Besar sudut <i>w</i> sama dengan …',fig:'f13',o:['40°','45°','50°','55°','60°'],k:4,e:'Segitiga bawah: sudut di titik potong <i>X</i> = 180° − 55° − 50° = 75°. Segitiga kecil di bawah garis mendatar tengah juga punya sudut 75° di <i>X</i> (bertolak belakang) dan 55° di kiri (bertolak belakang dengan sudut dalam segitiga kiri: 180° − 45° − 80° = 55°). Maka sudut kanannya = 180° − 75° − 55° = 50°, yang bertolak belakang dengan sudut dasar segitiga kanan. Jadi <i>w</i> = 180° − 70° − 50° = 60°.'},
{t:'Hasil survei terhadap 200 orang: 60 orang menyukai sepak bola dan 80 orang menyukai bulutangkis. Jika banyak orang yang tidak menyukai keduanya sama dengan dua kali banyak orang yang menyukai keduanya, manakah hubungan yang benar antara kuantitas P dan Q berdasarkan informasi yang diberikan?',tb:{h:['P','Q'],r:[['Banyak orang yang tidak menyukai kedua olahraga tersebut','60']]},o:QC,k:0,e:'Misal yang menyukai keduanya = <i>x</i>, tidak menyukai keduanya = 2<i>x</i>. 60 + 80 − <i>x</i> + 2<i>x</i> = 200 → <i>x</i> = 60. Maka P = 2<i>x</i> = 120 = 2 × 60 = 2Q, sehingga P ≥ 2Q.'},
{t:'Jumlah penduduk suatu desa adalah 1500; 1200 memiliki sepeda motor dan 600 orang memiliki mobil. Jika <i>a</i> dan <i>b</i> adalah jumlah minimum yang memiliki keduanya dan maksimum yang tidak memiliki keduanya, manakah hubungan yang benar antara kuantitas P dan Q?',tb:{h:['P','Q'],r:[['<i>a</i> + <i>b</i>','650']]},o:QC,k:3,e:'Minimum yang memiliki keduanya: <i>a</i> = 1200 + 600 − 1500 = 300. Maksimum yang tidak memiliki keduanya: <i>b</i> = 1500 − 1200 = 300 (semua yang tidak punya motor, dengan yang punya mobil seluruhnya punya motor juga). P = 600 < 650 = Q.'},
{t:'Jika <i>A</i><sup><i>C</i></sup> menyatakan komplemen dari himpunan <i>A</i>, maka pernyataan yang menyatakan daerah yang diarsir pada diagram di bawah ini adalah …',fig:'f16',st:STMT4,o:P4,k:0,e:'Daerah arsir adalah bagian <i>A</i> yang tidak berada di <i>B</i> maupun <i>C</i>. (1), (2), dan (3) semuanya menyatakan daerah itu. (4) <i>A</i> ∩ (<i>B</i> ∪ <i>C</i>) justru bagian <i>A</i> yang beririsan dengan <i>B</i> atau <i>C</i>.'},
{t:'Diketahui bangun datar sebagai berikut. Ada berapa bangun di atas yang memiliki dua simetri putar dan dua simetri lipat?',st:['Persegi panjang bukan persegi','Belah ketupat bukan persegi','Segitiga sama kaki bukan sama sisi','Layang-layang bukan persegi'],o:['0','1','2','3','4'],k:2,e:'Persegi panjang (bukan persegi) dan belah ketupat (bukan persegi) masing-masing punya 2 simetri lipat dan simetri putar tingkat 2. Segitiga sama kaki hanya 1 simetri lipat dan tanpa simetri putar, layang-layang 1 simetri lipat. Jadi ada 2 bangun.'},
{t:'Hubungan antara himpunan <i>A</i>, <i>B</i>, dan <i>C</i> disajikan pada diagram Venn. Berapakah banyaknya dari empat pernyataan berikut yang bernilai benar berdasarkan informasi di atas?',fig:'f18',st:['(<i>A</i> ∪ <i>B</i>) ⊆ <i>C</i>','<i>B</i> ⊆ (<i>A</i> ∩ <i>C</i>)','<i>B</i> ⊆ (<i>A</i> ∪ <i>C</i>)','(<i>B</i> ∪ <i>C</i>) ⊆ <i>A</i>'],o:['0','1','2','3','4'],k:0,e:'Pada diagram, <i>A</i> dan <i>C</i> tidak beririsan, sedangkan <i>B</i> beririsan dengan keduanya dan sebagian <i>B</i> berada di luar <i>A</i> maupun <i>C</i>. (1) <i>A</i> ∪ <i>B</i> tidak termuat di <i>C</i>. (2) <i>B</i> bukan bagian dari <i>A</i> ∩ <i>C</i> (yang kosong). (3) <i>B</i> punya bagian di luar <i>A</i> ∪ <i>C</i>. (4) <i>B</i> ∪ <i>C</i> tidak termuat di <i>A</i>. Keempatnya salah, jadi banyak yang benar = 0.'},
{t:'Perhatikan gambar berikut! Jika <i>AC</i> = <i>BC</i> = <i>BE</i> dan ∠<i>BAC</i> = 48°, berapakah besar ∠<i>ACD</i>? Putuskan apakah pernyataan (1) dan (2) berikut cukup untuk menjawab pertanyaan tersebut.',fig:'f19',st:['∠<i>BED</i> = 108°','∠<i>CBE</i> = 36°'],o:DS,k:3,e:'∠<i>ACB</i> = 180° − 2 · 48° = 84°. (2): ∠<i>CBE</i> = 36° dan <i>BC</i> = <i>BE</i> → ∠<i>BCE</i> = 72°, sehingga ∠<i>ACD</i> = 84° − 72° = 12°. (1): ∠<i>BED</i> = 108° → ∠<i>BEC</i> = 72° → ∠<i>BCE</i> = 72°, hasilnya sama, 12°. Masing-masing cukup.'},
{t:'Perhatikan gambar di bawah ini! Berapakah besar sudut <i>y</i>? Putuskan apakah pernyataan (1) dan (2) berikut cukup untuk menjawab pertanyaan tersebut.',fig:'f20',st:['<i>a</i> dan <i>b</i> adalah dua garis yang sejajar.','<i>x</i> = 60°'],o:DS,k:2,e:'Tanpa mengetahui <i>a</i> ∥ <i>b</i>, sudut <i>y</i> tidak bisa dikaitkan dengan sudut 40°. Tanpa nilai <i>x</i>, kemiringan garis kanan tidak diketahui. Dengan keduanya: garis kanan membentuk 180° − 40° − 60° = 80° terhadap <i>a</i>, lalu <i>y</i> ditentukan dengan sifat sudut pada garis sejajar. Dibutuhkan kedua pernyataan.'}
]},
PM:{name:'Penalaran Matematika',short:'PM',minutes:42.5,
ctx:{
1:{l:'Teks 1',h:'<p>Pada sebuah kantin sekolah, Ayu membeli 3 buah buku tulis, sebuah pensil, dan 2 buah pulpen seharga Rp39.000,00. Budi membeli sebuah buku tulis, 2 buah pensil, dan 3 buah pulpen seharga Rp26.000,00. Di kantin tersebut, harga sebuah buku tulis Rp5.000,00 lebih mahal daripada harga sebuah pensil.</p>'},
2:{l:'Teks 2',h:'<p>Bu Ani ingin kebutuhan air minum keluarganya tercukupi dengan baik. Keluarga Bu Ani terdiri dari 5 orang: Bu Ani, suaminya, dan 3 orang anaknya. Berat badan mereka berbeda-beda: Bu Ani 55 kg, Pak Budi 75 kg, Cecep 65 kg, Deni 60 kg, dan Eni 45 kg. Berdasarkan anjuran Kementerian Kesehatan, banyak air yang diminum per hari dapat dihitung sesuai berat badan seseorang.</p><div class="tw"><table class="dt"><tr><th>Berat badan (kg)</th><th>45</th><th>50</th><th>55</th><th>60</th><th>65</th><th>70</th><th>75</th><th>80</th><th>85</th><th>90</th><th>95</th><th>100</th></tr><tr><th>Air minum (liter)</th><td>1,9</td><td>2,1</td><td>2,3</td><td>2,5</td><td>2,7</td><td>2,9</td><td>3,2</td><td>3,5</td><td>3,7</td><td>3,9</td><td>4,1</td><td>4,3</td></tr></table></div>'},
3:{l:'Teks 3',h:'<p>Sebuah perpustakaan mempunyai 3 kategori buku koleksi, yakni novel, komik, dan ilmu pengetahuan. Perbandingan banyaknya koleksi buku disajikan dalam diagram lingkaran berikut. Bagian yang diarsir (ilmu pengetahuan) diperinci menjadi tiga bagian pada lingkaran kecil: ekonomi, sains, dan sejarah.</p>',fig:'p3'},
4:{l:'Teks 4',h:'<p>Lantai suatu gedung penyimpanan berbentuk persegi panjang dengan ukuran 6,5 m × 6 m akan dipasang ubin berukuran 60 cm × 60 cm (pemotongan ubin diperbolehkan). Satu lusin ubin dijual dengan harga Rp540.000,00 dan tidak dapat dibeli satuan. Rata-rata waktu yang dibutuhkan untuk menutupi 3 m² lantai dengan ubin adalah 10 menit.</p>'},
5:{l:'Teks 5',h:'<p>Sarah berencana membuat sebuah kap lampu dari bahan-bahan yang ada di rumah. Ia membuat kerangkanya dari kawat dan penutupnya dari kain yang sudah tidak terpakai. Sarah berpikir bentuk kap lampu tersebut merupakan limas persegi yang dipotong sejajar alas. Ia menggambar rancangan: <i>AB</i> = 36 cm, <i>AE</i> = 20 cm, dan <i>TH</i> = 10 cm. Kap lampu yang dibuat Sarah adalah Bagian II (limas terpotong <i>ABCD.EFGH</i>).</p>',fig:'p5'}
},
q:[
{c:1,t:'Jika Andi membeli 2 buah buku tulis, 4 buah pensil, dan 5 buah pulpen, kemudian membayar Rp100.000,00, maka uang kembalian yang harus Andi terima sebesar …',o:['Rp20.000,00','Rp30.000,00','Rp40.000,00','Rp50.000,00','Rp60.000,00'],k:3,e:'Misal buku = <i>k</i>, pensil = <i>p</i>, pulpen = <i>l</i>, dengan <i>k</i> = <i>p</i> + 5.000. Dari data Ayu: 4<i>p</i> + 2<i>l</i> = 24.000, dari data Budi: <i>p</i> + <i>l</i> = 7.000. Maka <i>p</i> = 5.000, <i>l</i> = 2.000, <i>k</i> = 10.000. Belanja Andi = 20.000 + 20.000 + 10.000 = 50.000, kembalian Rp50.000,00.'},
{c:1,t:'Selisih harga dua buah pensil dengan sebuah pulpen adalah …',o:['Rp1.000,00','Rp2.000,00','Rp4.000,00','Rp6.000,00','Rp8.000,00'],k:4,e:'2 × 5.000 − 2.000 = 8.000.'},
{c:1,t:'Jika Badu membayar sebesar Rp50.000,00, ia mendapat 3 buah buku tulis, 5 buah pulpen, dan … buah pensil.',o:['2','3','4','5','6'],k:0,e:'3 × 10.000 + 5 × 2.000 = 40.000. Sisa 10.000 = 2 pensil (2 × 5.000).'},
{c:1,t:'Dendi hendak membelanjakan uang sebesar Rp20.000,00. Barang yang bisa dia beli adalah …',st:['4 buah pensil dan 2 buah pulpen','3 buah pensil dan 2 buah pulpen','2 buah buku tulis dan 1 buah pulpen','1 buah pensil dan 1 buah buku tulis'],after:'Pernyataan di atas yang benar adalah …',o:N4,k:2,e:'(1) 20.000 + 4.000 = 24.000 ✗. (2) 15.000 + 4.000 = 19.000 ✓. (3) 20.000 + 2.000 = 22.000 ✗. (4) 5.000 + 10.000 = 15.000 ✓. Jadi (2) dan (4).'},
{c:2,tf:1,lab:['Benar','Salah'],t:'Berdasarkan berat badan anggota keluarga Bu Ani dan kebutuhan air minum sesuai anjuran Kementerian Kesehatan, tentukan pernyataan berikut Benar atau Salah.',r:['Jumlah kebutuhan air minum Eni dan Deni lebih banyak daripada kebutuhan air minum Pak Budi.','Jumlah kebutuhan air minum anak-anak lebih banyak daripada kebutuhan air minum orang tuanya.','Jumlah kebutuhan air minum Bu Ani dan Deni selalu lebih sedikit daripada jumlah kebutuhan air minum Pak Budi dan Eni.'],k:[0,0,0],e:'Kebutuhan: Eni 1,9 L; Deni 2,5 L; Pak Budi 3,2 L; Bu Ani 2,3 L; Cecep 2,7 L. (1) 1,9 + 2,5 = 4,4 > 3,2 → Benar. (2) Anak: 2,7 + 2,5 + 1,9 = 7,1 > orang tua: 2,3 + 3,2 = 5,5 → Benar. (3) 2,3 + 2,5 = 4,8 < 3,2 + 1,9 = 5,1 → Benar.'},
{c:2,tf:1,lab:['Benar','Salah'],t:'Apabila Bu Ani selalu membeli galon air minum berisi 19 liter untuk memenuhi kebutuhan air minum sesuai anjuran Kementerian Kesehatan, tentukan pernyataan berikut Benar atau Salah.',r:['Satu galon mencukupi kebutuhan air minum keluarga Bu Ani dalam satu hari.','Empat galon tidak mencukupi kebutuhan air minum keluarga Bu Ani selama 5 hari.','Untuk memenuhi kebutuhan keluarganya selama seminggu Bu Ani harus menyiapkan paling sedikit 5 galon air minum.'],k:[0,1,0],e:'Kebutuhan keluarga per hari = 2,3 + 3,2 + 2,7 + 2,5 + 1,9 = 12,6 L. (1) 19 L ≥ 12,6 L → Benar. (2) 5 hari = 63 L dan 4 galon = 76 L, cukup → pernyataan Salah. (3) 7 × 12,6 = 88,2 L; 88,2 ÷ 19 ≈ 4,64 → minimal 5 galon → Benar.'},
{c:2,t:'Di rumah keluarga Bu Ani terdapat gelas minum dengan 3 jenis ukuran: kecil 160 ml, sedang 220 ml, besar 350 ml. Berdasarkan kebutuhan air minum keluarga Bu Ani dan ukuran gelas yang tersedia, pernyataan yang benar adalah …',st:['Kebutuhan air minum Bu Ani tidak akan terpenuhi jika ia minum 5 gelas ukuran besar dan 2 gelas ukuran sedang dalam sehari','Kebutuhan air minum Pak Budi akan terpenuhi jika ia minum 7 gelas ukuran besar dalam sehari','Agar kebutuhan air minum Eni terpenuhi selama sehari, ia minum 5 gelas ukuran sedang dan 5 gelas ukuran kecil','Jumlah kebutuhan air minum Cecep dan Deni dalam sehari setara dengan 16 gelas ukuran besar'],o:N4,k:1,e:'(1) Bu Ani butuh 2.300 ml; 5 × 350 + 2 × 220 = 2.190 ml < 2.300 → benar. (2) Pak Budi butuh 3.200 ml; 7 × 350 = 2.450 ml → salah. (3) Eni butuh 1.900 ml; 5 × 220 + 5 × 160 = 1.900 ml → benar. (4) Cecep + Deni = 5.200 ml; 16 × 350 = 5.600 ml → salah. Jadi (1) dan (3).'},
{c:2,t:'Satu galon air minum merek X berisi 19 liter dan harga satu galon adalah Rp40.000,00. Total biaya minimal untuk membeli air minum yang memenuhi kebutuhan keluarga Bu Ani selama seminggu adalah …',o:['Rp280.000,00','Rp240.000,00','Rp220.000,00','Rp200.000,00','Rp160.000,00'],k:3,e:'Kebutuhan seminggu = 88,2 L → 5 galon. Biaya = 5 × 40.000 = Rp200.000,00.'},
{c:3,t:'Diketahui buku sejarah ada sebanyak 70 buah. Banyak buku novel berada di antara …',o:['kurang dari 401','di antara 401 dan 451','di antara 451 dan 501','di antara 501 dan 551','lebih dari 551'],k:4,e:'Pada lingkaran kecil: sejarah = 360° − 60° − 90° = 210° untuk 70 buku, jadi 1° = ⅓ buku, dan seluruh ilmu pengetahuan = 120 buku. Pada lingkaran besar, ilmu pengetahuan = 360° − 120° − 200° = 40° → 120 buku, jadi 1° = 3 buku. Novel = 200° × 3 = 600 buku (lebih dari 551).'},
{c:3,t:'Diketahui buku sejarah ada sebanyak 70 buah. Perbandingan banyaknya buku komik dan buku ekonomi adalah …',o:['21 : 1','18 : 1','12 : 1','21 : 2','9 : 1'],k:1,e:'Komik = 120° × 3 = 360 buku. Ekonomi = 60° × ⅓ = 20 buku. Perbandingan = 360 : 20 = 18 : 1.'},
{c:3,t:'Diketahui buku sejarah ada sebanyak 70 buah. Selisih banyaknya buku novel dan buku ilmu pengetahuan adalah …',o:['520','510','500','480','440'],k:3,e:'Novel = 600 dan ilmu pengetahuan = 120, sehingga selisihnya 480.'},
{c:3,tf:1,lab:['Benar','Salah'],t:'Diketahui buku sejarah ada sebanyak 70 buah. Tentukan pernyataan berikut Benar atau Salah.',r:['Total banyaknya komik dan buku sains < 400','Total banyaknya semua buku ilmu pengetahuan = 120','Total koleksi buku > 1.000'],k:[0,0,0],e:'Sains = 90° × ⅓ = 30 buku, komik = 360 → 390 < 400 (Benar). Ilmu pengetahuan = 120 (Benar). Total = 600 + 360 + 120 = 1.080 > 1.000 (Benar).'},
{c:4,t:'Luas minimal daerah lantai yang tidak terpasang ubin utuh adalah … m²',o:['1','2','3','4','5'],k:2,e:'Panjang 6 m muat 10 ubin utuh, 6,5 m muat 10 ubin (10 × 0,6 = 6 m). Ubin utuh = 100 buah = 100 × 0,36 = 36 m². Luas lantai 39 m², sehingga yang tidak terpasang ubin utuh = 39 − 36 = 3 m².'},
{c:4,t:'Biaya minimal yang diperlukan untuk membeli ubin yang dapat menutupi seluruh lantai adalah …',o:['Rp4.500.000,00','Rp4.950.000,00','Rp5.200.000,00','Rp5.350.000,00','Rp5.400.000,00'],k:4,e:'Luas lantai 39 m² ÷ 0,36 m² = 108,33 → minimal 109 ubin. Dibeli per lusin: 109 ÷ 12 ≈ 9,08 → 10 lusin. Biaya = 10 × Rp540.000 = Rp5.400.000,00.'},
{c:4,t:'Total waktu yang dibutuhkan untuk memasang ubin pada seluruh bagian lantai adalah … menit',o:['100','110','120','130','140'],k:3,e:'39 m² ÷ 3 m² = 13 satuan, 13 × 10 menit = 130 menit.'},
{c:4,tf:1,lab:['Mungkin','Tidak mungkin'],t:'Jika ukuran ubin diganti, manakah ukuran berikut yang dapat menutupi lantai tanpa melakukan pemotongan ubin? Pilih untuk tiap pernyataan.',r:['Ukuran ubin yang digunakan adalah 30 cm × 30 cm','Ukuran ubin yang digunakan adalah 40 cm × 40 cm','Ukuran ubin yang digunakan adalah 50 cm × 50 cm'],k:[1,1,0],e:'Lantai 650 cm × 600 cm. 30 cm: 650 ÷ 30 ≈ 21,67 → tidak habis. 40 cm: 650 ÷ 40 = 16,25 → tidak habis. 50 cm: 650 ÷ 50 = 13 dan 600 ÷ 50 = 12 → habis, mungkin.'},
{c:5,t:'Volume kap lampu yang dibuat adalah … cm³',o:['2.496√7','1.682√7','1.482','936√7','1.028'],k:0,e:'Limas penuh: rusuk tegak 30 cm (karena 20 + 10), dan bagian atas berukuran sama dengan ⅓ → sisi atas 12 cm. Selisih setengah diagonal alas dan atas = 18√2 − 6√2 = 12√2, sehingga tinggi limas terpotong = √(20² − 288) = √112 = 4√7. Volume = ⅓ × 4√7 × (1.296 + 144 + 432) = ⅓ × 4√7 × 1.872 = 2.496√7 cm³.'},
{c:5,tf:1,lab:['Benar','Salah'],t:'Tentukan pernyataan berikut Benar atau Salah.',r:['Panjang minimal kawat yang diperlukan Sarah untuk membentuk kerangka kap lampu adalah 136 cm.','Luas kap lampu yang tidak tertutup kain adalah 1.440 cm².','Potongan kain yang digunakan untuk menutup kap lampu berbentuk trapesium siku-siku.'],k:[1,0,1],e:'(1) Kerangka: 4 × 36 + 4 × 12 + 4 × 20 = 272 cm, bukan 136 cm → Salah. (2) Bagian tak tertutup = alas + tutup atas = 36² + 12² = 1.296 + 144 = 1.440 cm² → Benar. (3) Sisi bidang tegak berbentuk trapesium sama kaki, bukan siku-siku → Salah.'},
{c:5,t:'Luas kain yang diperlukan Sarah untuk membuat kap lampu tersebut adalah … cm²',o:['1.682','1.536','1.482','1.120','768'],k:1,e:'Tinggi trapesium sisi tegak = √(20² − 12²) = 16 cm. Luas satu sisi = ½ × (36 + 12) × 16 = 384 cm². Empat sisi = 1.536 cm².'},
{c:5,t:'Sarah hendak mengecat kain penutup kap lampu. Harga satu kaleng cat Rp20.000,00 untuk luas 50 cm². Pengeluaran Sarah untuk membeli cat sebesar …',o:['Rp480.000,00','Rp540.000,00','Rp600.000,00','Rp620.000,00','Rp640.000,00'],k:3,e:'1.536 ÷ 50 = 30,72 → dibulatkan ke atas menjadi 31 kaleng. Biaya = 31 × Rp20.000 = Rp620.000,00.'}
]}
};
</script>
<script>
/* ===== Gambar soal (diambil dari PDF) ===== */
function im(k,alt){return '<div class="figbox"><img src="'+IMG[k]+'" alt="'+(alt||'Gambar soal')+'"></div>';}
var FIG={f1:function(){return im('f1');},f2:function(){return im('f2');},f8:function(){return im('f8');},f10:function(){return im('f10');},f11:function(){return im('f11');},f13:function(){return im('f13');},f16:function(){return im('f16');},f18:function(){return im('f18');},f19:function(){return im('f19');},f20:function(){return im('f20');},
p3:function(){return im('p3','Diagram lingkaran koleksi buku');},
p5:function(){return '<div class="figrow"><div class="figbox"><img style="max-height:110px" src="'+IMG.lamp+'" alt="Kap lampu"></div>'+im('p5','Rancangan kap lampu').replace('class="figbox"','class="figbox" style="margin:12px 0 4px"')+'</div>';}};

/* ===== Util & penyimpanan ===== */
var $=function(s,r){return (r||document).querySelector(s);};
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var A=[]; /* semua riwayat */
var colRef=null, storeMode='local', syncErr=false;
function parseAtt(o){try{return {id:o.id,subj:o.subj,ts:+o.ts,dur:+o.dur,score:+o.score,ok:+o.ok,bad:+o.bad,blank:+o.blank,ans:typeof o.ans==='string'?JSON.parse(o.ans):o.ans,flags:o.flags||[]};}catch(e){return null;}}
function mergeAtt(list){var m={};A.forEach(function(a){m[a.id]=a;});list.forEach(function(a){if(a)m[a.id]=a;});A=Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.ts-b.ts;});lsSet('to_att',A.map(ser));}
function ser(a){return {id:a.id,subj:a.subj,ts:a.ts,dur:a.dur,score:a.score,ok:a.ok,bad:a.bad,blank:a.blank,ans:JSON.stringify(a.ans)};}
(lsGet('to_att')||[]).forEach(function(o){var a=parseAtt(o);if(a)A.push(a);});
A.sort(function(a,b){return a.ts-b.ts;});
function saveAtt(a){mergeAtt([a]);if(colRef){colRef.doc(a.id).set(ser(a)).catch(function(){syncErr=true;toast('Riwayat tersimpan di perangkat ini saja.');});}}
function delAtt(id){A=A.filter(function(a){return a.id!==id;});lsSet('to_att',A.map(ser));if(colRef){colRef.doc(id).delete().catch(function(){});}}
function initCloud(){
  if(!window.claude||!claude.use)return;
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user||!user.id)return;
    return user.id().then(function(id){
      colRef=db.collection('data/users/'+id);storeMode='cloud';
      var local=A.slice();
      colRef.onSnapshot(function(snap){
        var got=[],seen={};snap.docs.forEach(function(d){seen[d.id]=1;var a=parseAtt(Object.assign({id:d.id},d.data()));if(a)got.push(a);});
        mergeAtt(got);
        local.forEach(function(a){if(!seen[a.id]){colRef.doc(a.id).set(ser(a)).catch(function(){});seen[a.id]=1;}});
        local=[];
        if(S.view==='home'||S.view==='history')render();
      },function(){storeMode='local';});
    });
  }).catch(function(){});
}

/* ===== State ===== */
var S={view:'home',subj:'PK',hf:'all'};
var P=lsGet('to_prog'); /* {subj,start,end,ans,flags,cur} */
var tick=null,navOpen=false;
function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function fdate(ts){var d=new Date(ts);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},3200);}
function mood(s){return s>=80?'Mantap sekali!':s>=60?'Bagus, terus naik!':s>=40?'Lumayan, lanjut latihan!':'Tenang, ini baru awal.';}
function forSubj(k){return A.filter(function(a){return a.subj===k;});}
function isAnswered(q,v){return q.tf?(v&&v.some(function(x){return x!==null&&x!==undefined;})):(v!==null&&v!==undefined);}
function isRight(q,v){if(q.tf){return !!v&&q.k.every(function(x,i){return v[i]===x;});}return v===q.k;}
function grade(subj,ans){var Q=QUIZ[subj].q,ok=0,bad=0,bl=0;Q.forEach(function(q,i){var v=ans[i];if(!isAnswered(q,v))bl++;else if(isRight(q,v))ok++;else bad++;});return {ok:ok,bad:bad,blank:bl,score:Math.round(ok/Q.length*100)};}

/* ===== Komponen ===== */
function topbar(){
  var el=$('#topbar');
  if(S.view==='exam'){
    var q=QUIZ[P.subj];
    el.innerHTML='<div class="wrap bar"><span class="chip'+(P.subj==='PM'?' pm':'')+'">'+P.subj+'</span><span class="qn">Soal '+(P.cur+1)+' / '+q.q.length+'</span><span class="sp"></span><button class="btn ghost sm navtoggle" data-act="navopen">Nomor</button><div class="timer mono" id="tm" aria-live="off">--:--</div><button class="btn sm" data-act="finish">Kumpulkan</button></div><div class="prog"><i id="pg" style="width:0"></i></div>';
    return;
  }
  var cur=S.view==='history'?'riwayat':'beranda';
  el.innerHTML='<div class="wrap bar"><button class="brand" data-act="home" aria-label="Beranda"><span class="mark">T</span><span>Tryout UTBK</span></button><nav class="tabs" aria-label="Menu"><button class="tab" data-act="home" '+(cur==='beranda'?'aria-current="page"':'')+'>Beranda</button><button class="tab" data-act="history" '+(cur==='riwayat'?'aria-current="page"':'')+'>Riwayat</button></nav></div>';
}
function spark(k){
  var l=forSubj(k).slice(-10);
  if(!l.length)return '<div class="empty-spark">Belum ada percobaan. Skor tiap percobaan akan muncul di sini.</div>';
  var w=300,h=64,pad=8,n=l.length,pts=l.map(function(a,i){return [n===1?w/2:pad+i*(w-2*pad)/(n-1),h-pad-(a.score/100)*(h-2*pad)];});
  var col=k==='PK'?'var(--blue)':'var(--pink)';
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Skor '+n+' percobaan terakhir"><line x1="0" x2="'+w+'" y1="'+(h-pad)+'" y2="'+(h-pad)+'" stroke="var(--ink)" stroke-opacity=".3" stroke-dasharray="3 5"/>'+(n>1?'<polyline fill="none" stroke="'+col+'" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>':'')+pts.map(function(p){return '<rect x="'+(p[0]-5).toFixed(1)+'" y="'+(p[1]-5).toFixed(1)+'" width="10" height="10" rx="2" fill="'+col+'" stroke="var(--ink)" stroke-width="2.5"/>';}).join('')+'</svg>';
}
function subjCard(k){
  var q=QUIZ[k],l=forSubj(k),best=l.length?Math.max.apply(null,l.map(function(a){return a.score;})):'–',avg=l.length?Math.round(l.reduce(function(s,a){return s+a.score;},0)/l.length):'–',last=l.length?l[l.length-1].score:'–';
  var run=P&&P.subj===k;
  var bub='<div class="bubbles" aria-hidden="true">'+[0,1,2,3,4].map(function(i){return '<i'+(i===(k==='PK'?1:3)?' class="f"':'')+'></i>';}).join('')+'</div>';
  return '<section class="subj'+(k==='PM'?' pm':'')+'" aria-labelledby="h'+k+'"><div class="subj-head">'+bub+'<div class="mono-big" aria-hidden="true">'+k+'</div><h2 id="h'+k+'">'+q.name+'</h2><p>Tryout 1 · Pola UTBK 2026/2027</p><div class="badge">'+q.q.length+' soal · '+String(q.minutes).replace('.',',')+' menit</div></div><div class="subj-body"><div class="triple"><div><b>'+l.length+'</b><span>Percobaan</span></div><div><b>'+best+'</b><span>Terbaik</span></div><div><b>'+avg+'</b><span>Rata-rata</span></div></div>'+spark(k)+'<button class="btn '+(k==='PK'?'blue':'danger')+'" data-act="start" data-s="'+k+'"'+(run?' disabled':'')+'>'+(l.length?'Ulangi tryout '+k+' →':'Mulai tryout '+k+' →')+'</button></div></section>';
}
function renderHome(){
  var total=A.length,best=total?Math.max.apply(null,A.map(function(a){return a.score;})):'–';
  var res='';
  if(P){var left=Math.round((P.end-Date.now())/1000);res='<div class="resume"><div><b>Tryout '+P.subj+' belum selesai.</b> '+(left>0?'Sisa waktu '+fmt(left)+'.':'Waktu sudah habis.')+'</div><span class="sp"></span><button class="btn ghost sm" data-act="drop">Batalkan</button><button class="btn sm blue" data-act="resume">'+(left>0?'Lanjutkan':'Lihat hasil')+'</button></div>';}
  $('#app').innerHTML='<div class="wrap"><div class="hero"><div><span class="stk">Tryout 1 · Pola UTBK 26/27</span><h1>Latihan PK &amp; PM sampai skormu <mark>naik</mark>.</h1><p class="lead">Kerjakan dengan timer sungguhan, cek pembahasannya, lalu ulangi sesukamu. Setiap percobaan masuk riwayat.</p></div><div class="statpile" aria-label="Ringkasan"><div class="stat s1"><b>'+total+'</b><span>percobaan</span></div><div class="stat s2"><b>'+best+'</b><span>skor tertinggi</span></div></div></div>'+res+'<div class="subjects">'+subjCard('PK')+subjCard('PM')+'</div><div class="rules"><div class="rule"><b>Timer sungguhan</b>PK 20 menit dan PM 42,5 menit. Waktu habis, jawaban dikumpulkan otomatis.</div><div class="rule"><b>Cara hitung skor</b>Benar ÷ 20 × 100. Soal tabel dianggap benar kalau semua barisnya benar.</div><div class="rule"><b>Aman kalau keluar</b>Jawaban dan sisa waktu tersimpan, jadi bisa dilanjutkan.</div></div></div>';
}
function opts(q,v,mode){
  var h='';
  if(q.tf){
    h='<div class="tf" role="group" aria-label="Pilih untuk tiap pernyataan">';
    q.r.forEach(function(r,i){
      h+='<div class="tfrow"><div>'+r+'</div><div class="tfbtns" role="radiogroup">';
      q.lab.forEach(function(lb,j){
        if(mode==='exam')h+='<button class="pill" role="radio" aria-checked="'+(v&&v[i]===j)+'" data-act="tf" data-r="'+i+'" data-v="'+j+'">'+lb+'</button>';
        else{var c='pill';if(q.k[i]===j)c+=(v&&v[i]===j)?' ok':' key';else if(v&&v[i]===j)c+=' no';h+='<span class="'+c+'">'+lb+(q.k[i]===j?' ✓':'')+'</span>';}
      });
      h+='</div></div>';
    });
    return h+'</div>';
  }
  h='<div class="opts" '+(mode==='exam'?'role="radiogroup" aria-label="Pilihan jawaban"':'')+'>';
  q.o.forEach(function(o,i){
    if(mode==='exam')h+='<button class="opt" role="radio" aria-checked="'+(v===i)+'" data-act="pick" data-v="'+i+'"><span class="let">'+L5[i]+'</span><span class="tx">'+o+'</span></button>';
    else{var c='opt',t='';if(i===q.k){c+=' ok';t='<span class="tag">Kunci</span>';if(v===i)t='<span class="tag">Jawabanmu ✓</span>';}else if(v===i){c+=' no';t='<span class="tag">Jawabanmu</span>';}
      h+='<div class="'+c+'"><span class="let">'+L5[i]+'</span><span class="tx">'+o+'</span>'+t+'</div>';}
  });
  return h+'</div>';
}
function qBody(subj,i,v,mode){
  var Z=QUIZ[subj],q=Z.q[i],h='';
  if(q.c){var c=Z.ctx[q.c];h+='<div class="ctx"><div class="ctxlab">'+c.l+'</div>'+c.h+(c.fig?FIG[c.fig]():'')+'</div>';}
  h+='<p class="qtext">'+q.t+'</p>';
  if(q.fig)h+=FIG[q.fig]();
  if(q.tb)h+='<div class="tw"><table class="qt"><tr>'+q.tb.h.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>'+q.tb.r.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
  if(q.st)h+='<ul class="stmts">'+q.st.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';
  if(q.after)h+='<p class="qtext">'+q.after+'</p>';
  return h+opts(q,v,mode);
}
function navGrid(subj,ans,flags,cur,review){
  var Q=QUIZ[subj].q;
  return '<div class="ngrid">'+Q.map(function(q,i){
    var c='nb';
    if(review){c+=isAnswered(q,ans[i])?(isRight(q,ans[i])?' ok':' no'):' no';}
    else{if(isAnswered(q,ans[i]))c+=' ans';if(flags&&flags[i])c+=' flag';}
    if(i===cur)c+=' cur';
    return '<button class="'+c+'" data-act="go" data-i="'+i+'" aria-label="Soal '+(i+1)+'">'+(i+1)+'</button>';
  }).join('')+'</div>';
}
function renderExam(){
  topbar();
  var Z=QUIZ[P.subj],i=P.cur,q=Z.q[i],v=P.ans[i],fl=!!P.flags[i];
  var done=Object.keys(P.ans).filter(function(k){return isAnswered(Z.q[k],P.ans[k]);}).length;
  $('#app').innerHTML='<div class="wrap exam"><article class="qcard"><div class="qhead"><span class="qnum">'+(i+1)+'<small>/ '+Z.q.length+'</small></span><button class="pill flagbtn" data-act="flag" aria-pressed="'+fl+'">'+(fl?'⚑ Ditandai ragu':'⚐ Tandai ragu')+'</button></div>'+qBody(P.subj,i,v,'exam')+'<div class="qfoot"><button class="btn ghost" data-act="prev"'+(i===0?' disabled':'')+'>← Sebelumnya</button>'+(i<Z.q.length-1?'<button class="btn" data-act="next">Berikutnya →</button>':'<button class="btn" data-act="finish">Kumpulkan</button>')+'</div></article><aside class="navp'+(navOpen?' open':'')+'" aria-label="Navigasi soal"><h3>Nomor soal <span class="muted">'+done+'/'+Z.q.length+' terisi</span></h3>'+navGrid(P.subj,P.ans,P.flags,i,false)+'<div class="legend"><span><i class="a"></i>Terjawab</span><span><i class="f"></i>Ragu</span></div><button class="btn" data-act="finish">Kumpulkan jawaban</button></aside></div>'+(navOpen?'<div class="scrim" data-act="navclose"></div>':'');
  tickNow();
}
function tickNow(){
  if(S.view!=='exam'||!P)return;
  var left=(P.end-Date.now())/1000,tot=QUIZ[P.subj].minutes*60,t=$('#tm'),g=$('#pg');
  if(t){t.textContent=fmt(left);t.className='timer mono'+(left<=60?' crit':left<=300?' warn':'');}
  if(g)g.style.width=Math.min(100,Math.max(0,(1-left/tot)*100))+'%';
  if(left<=0){finish(true);}
}
function startTick(){clearInterval(tick);tick=setInterval(tickNow,500);}
function ring(score){
  var r=88,c=2*Math.PI*r,d=c*score/100;
  return '<svg class="ring" viewBox="0 0 210 210" role="img" aria-label="Skor '+score+' dari 100"><circle cx="105" cy="105" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="105" cy="105" r="'+r+'" fill="none" stroke="var(--pk)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 105 105)"/><text class="rn" x="105" y="116" text-anchor="middle">'+score+'</text><text class="rs" x="105" y="140" text-anchor="middle">dari 100</text></svg>';
}
function renderResult(a){
  topbar();
  var Z=QUIZ[a.subj],l=forSubj(a.subj),idx=l.findIndex(function(x){return x.id===a.id;}),prev=idx>0?l[idx-1]:null,d='';
  if(prev){var df=a.score-prev.score;d='<span class="delta '+(df>0?'up':df<0?'down':'')+'">'+(df>0?'▲ +'+df:df<0?'▼ '+df:'Sama')+' dari percobaan sebelumnya ('+prev.score+')</span>';}
  else d='<span class="delta">Percobaan pertamamu di '+a.subj+'</span>';
  $('#app').innerHTML='<div class="wrap"><div class="result"><div class="score" role="img" aria-label="Skor '+a.score+' dari 100"><b>'+a.score+'</b><span>dari 100</span><div class="stamp">'+a.subj+'</div></div><div><span class="stk">Hasil · '+Z.name+' · ke-'+(idx+1)+'</span><h1>'+mood(a.score)+'</h1>'+d+'<div class="rtiles"><div class="rtile g"><b>'+a.ok+'</b><span>Benar</span></div><div class="rtile r"><b>'+a.bad+'</b><span>Salah</span></div><div class="rtile"><b>'+a.blank+'</b><span>Kosong</span></div><div class="rtile"><b class="mono">'+fmt(a.dur)+'</b><span>Waktu terpakai</span></div></div><div class="actions"><button class="btn blue" data-act="review" data-id="'+a.id+'" data-i="0">Lihat pembahasan</button><button class="btn ghost" data-act="start" data-s="'+a.subj+'">Ulangi '+a.subj+'</button><button class="btn ghost" data-act="history">Riwayat</button></div></div></div></div>';
}
var RV={id:null,i:0};
function renderReview(){
  topbar();
  var a=A.filter(function(x){return x.id===RV.id;})[0];if(!a){S.view='history';return render();}
  var Z=QUIZ[a.subj],i=RV.i,q=Z.q[i],v=a.ans[i],r=isAnswered(q,v)?isRight(q,v):false,st=!isAnswered(q,v);
  $('#app').innerHTML='<div class="wrap exam"><article class="qcard"><div class="qhead"><span class="qnum">'+(i+1)+'<small>/ '+Z.q.length+' · Pembahasan '+a.subj+'</small></span><span class="chip soft" style="'+(st?'':r?'background:var(--good-soft);color:var(--ink)':'background:var(--bad-soft);color:var(--ink)')+'">'+(st?'Tidak dijawab':r?'Benar':'Salah')+'</span></div>'+qBody(a.subj,i,v,'review')+'<div class="exp"><h4>Pembahasan</h4><p>'+q.e+'</p></div><div class="qfoot"><button class="btn ghost" data-act="rprev"'+(i===0?' disabled':'')+'>← Sebelumnya</button>'+(i<Z.q.length-1?'<button class="btn" data-act="rnext">Berikutnya →</button>':'<button class="btn" data-act="result" data-id="'+a.id+'">Kembali ke hasil</button>')+'</div></article><aside class="navp"><h3>Ringkasan <span class="muted">'+a.ok+'/'+Z.q.length+' benar</span></h3>'+navGrid(a.subj,a.ans,null,i,true)+'<div class="legend"><span><i class="g"></i>Benar</span><span><i class="r"></i>Salah / kosong</span></div><button class="btn ghost" data-act="result" data-id="'+a.id+'">Kembali ke hasil</button></aside></div>';
}
function chart(list){
  var maxN=Math.max.apply(null,['PK','PM'].map(function(k){return list.filter(function(a){return a.subj===k;}).length;}).concat([1]));
  var W=440,H=250,l=34,r=14,t=18,b=32,pw=W-l-r,ph=H-t-b,out='';
  [0,25,50,75,100].forEach(function(g){var y=t+ph-(g/100)*ph;out+='<line class="gl" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(l-8)+'" y="'+(y+4)+'" text-anchor="end">'+g+'</text>';});
  for(var n=1;n<=maxN;n++){var x=maxN===1?l+pw/2:l+(n-1)*pw/(maxN-1);if(maxN<=12||n%Math.ceil(maxN/12)===0||n===1)out+='<text class="ax" x="'+x+'" y="'+(H-10)+'" text-anchor="middle">'+n+'</text>';}
  out+='<text class="ax" x="'+(l+pw/2)+'" y="'+(H)+'" text-anchor="middle" style="display:none"></text>';
  var sets=[['PK','var(--blue)'],['PM','var(--pink)']];
  sets.forEach(function(s){
    var arr=list.filter(function(a){return a.subj===s[0];});if(!arr.length)return;
    var pts=arr.map(function(a,i){return [maxN===1?l+pw/2:l+i*pw/(maxN-1),t+ph-(a.score/100)*ph,a.score];});
    if(pts.length>1)out+='<polyline fill="none" stroke="'+s[1]+'" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
    pts.forEach(function(p,i){out+='<rect x="'+(p[0]-6).toFixed(1)+'" y="'+(p[1]-6).toFixed(1)+'" width="12" height="12" rx="3" fill="'+s[1]+'" stroke="var(--ink)" stroke-width="2.5"/>';if(pts.length<=12)out+='<text class="vl" x="'+p[0].toFixed(1)+'" y="'+(p[1]-10).toFixed(1)+'" text-anchor="middle" fill="'+s[1]+'">'+p[2]+'</text>';});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik skor per percobaan">'+out+'</svg><div class="muted" style="text-align:center;font-size:12px;font-weight:700">Percobaan ke-</div>';
}
function renderHistory(){
  topbar();
  var f=S.hf,list=A.filter(function(a){return f==='all'||a.subj===f;}),rows='';
  var nums={};A.forEach(function(a){nums[a.subj]=(nums[a.subj]||0)+1;a._n=nums[a.subj];});
  list.slice().reverse().forEach(function(a){
    rows+='<button class="hitem" data-act="result" data-id="'+a.id+'"><span class="chip'+(a.subj==='PM'?' pm':'')+'">'+a.subj+'</span><span><span class="t">Percobaan ke-'+a._n+'</span><br><span class="s">'+fdate(a.ts)+' · '+a.ok+' benar · '+fmt(a.dur)+'</span></span><span class="sc">'+a.score+'<small>dari 100</small></span></button>';
  });
  var body=A.length?'<div class="panel"><h2>Perkembangan skor</h2>'+chart(list)+'<div class="key"><span><i style="background:var(--blue)"></i>PK</span><span><i style="background:var(--pink)"></i>PM</span></div></div><div class="hlist">'+(rows||'<div class="emptybox">Belum ada percobaan untuk filter ini.</div>')+'</div>':'<div class="emptybox"><b>Riwayat masih kosong</b>Selesaikan satu tryout, lalu skornya akan muncul di sini.<div style="margin-top:16px"><button class="btn" data-act="home">Mulai tryout</button></div></div>';
  $('#app').innerHTML='<div class="wrap"><div class="page-head"><div><span class="stk">Riwayat</span><h1>Skor tiap percobaan</h1></div><div class="seg" role="group" aria-label="Filter">'+[['all','Semua'],['PK','PK'],['PM','PM']].map(function(x){return '<button data-act="hf" data-v="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></div><p class="muted" style="margin-bottom:16px">'+(storeMode==='cloud'&&!syncErr?'Tersimpan di akunmu, bisa dibuka dari perangkat lain.':'Tersimpan di perangkat ini.')+'</p>'+body+(A.length?'<div style="margin-bottom:40px"><button class="btn ghost sm" data-act="clear">Hapus semua riwayat</button></div>':'')+'</div>';
}
function render(){
  if(S.view==='exam'&&!P)S.view='home';
  window.scrollTo(0,0);
  ({home:function(){topbar();renderHome();},exam:renderExam,history:renderHistory,review:renderReview})[S.view]();
}
function modal(h){$('#layer').innerHTML='<div class="modal" data-act="mclose"><div class="dialog" role="dialog" aria-modal="true">'+h+'</div></div>';}
function mclose(){$('#layer').innerHTML='';}

/* ===== Alur ujian ===== */
function begin(k){
  mclose();var Z=QUIZ[k],now=Date.now();
  P={subj:k,start:now,end:now+Z.minutes*60000,ans:{},flags:{},cur:0};lsSet('to_prog',P);
  S.view='exam';navOpen=false;render();startTick();
}
function finish(auto){
  if(!P)return;clearInterval(tick);mclose();
  var Z=QUIZ[P.subj],g=grade(P.subj,P.ans),used=Math.min(Z.minutes*60,Math.round((Date.now()-P.start)/1000));
  var a={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),subj:P.subj,ts:P.start,dur:auto?Z.minutes*60:used,score:g.score,ok:g.ok,bad:g.bad,blank:g.blank,ans:P.ans};
  P=null;lsSet('to_prog',null);saveAtt(a);navOpen=false;
  if(auto)toast('Waktu habis. Jawabanmu dikumpulkan otomatis.');
  S.view='result';render2(a);
}
function render2(a){window.scrollTo(0,0);renderResult(a);}
function confirmFinish(){
  var Z=QUIZ[P.subj],n=Z.q.filter(function(q,i){return isAnswered(q,P.ans[i]);}).length,fl=Object.keys(P.flags).filter(function(k){return P.flags[k];}).length;
  modal('<h3>Kumpulkan sekarang?</h3><p>'+n+' dari '+Z.q.length+' soal sudah dijawab'+(Z.q.length-n?', '+(Z.q.length-n)+' masih kosong':'')+'.'+(fl?' '+fl+' soal ditandai ragu.':'')+'</p><p>Sisa waktu '+fmt((P.end-Date.now())/1000)+'. Setelah dikumpulkan, jawaban tidak bisa diubah.</p><div class="actions"><button class="btn ghost" data-act="mclose">Lanjut mengerjakan</button><button class="btn" data-act="dofinish">Kumpulkan</button></div>');
}
function save(){lsSet('to_prog',P);}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,d=el.dataset;
  if(el.disabled)return;
  switch(a){
    case 'home':S.view='home';location.hash='#beranda';render();break;
    case 'history':S.view='history';location.hash='#riwayat';render();break;
    case 'hf':S.hf=d.v;render();break;
    case 'start':{var k=d.s,Z=QUIZ[k];
      if(P){toast('Selesaikan atau batalkan tryout yang sedang berjalan dulu.');break;}
      modal('<h3>Mulai tryout '+k+'?</h3><p>'+Z.name+': '+Z.q.length+' soal dalam '+String(Z.minutes).replace('.',',')+' menit. Timer langsung berjalan begitu kamu menekan Mulai.</p><div class="actions"><button class="btn ghost" data-act="mclose">Nanti dulu</button><button class="btn" data-act="begin" data-s="'+k+'">Mulai sekarang</button></div>');break;}
    case 'begin':begin(d.s);break;
    case 'mclose':if(e.target===el||el.classList.contains('btn'))mclose();break;
    case 'resume':if(P&&P.end<=Date.now()){finish(true);}else{S.view='exam';render();startTick();}break;
    case 'drop':modal('<h3>Batalkan tryout ini?</h3><p>Jawabanmu pada percobaan yang sedang berjalan akan dibuang dan tidak masuk riwayat.</p><div class="actions"><button class="btn ghost" data-act="mclose">Tidak</button><button class="btn danger" data-act="dodrop">Ya, batalkan</button></div>');break;
    case 'dodrop':P=null;lsSet('to_prog',null);clearInterval(tick);mclose();S.view='home';render();break;
    case 'pick':{var v=+d.v,i=P.cur;if(P.ans[i]===v)delete P.ans[i];else P.ans[i]=v;save();renderBody();break;}
    case 'tf':{var i=P.cur,r=+d.r,v=+d.v,arr=P.ans[i]||[null,null,null];arr=arr.slice();arr[r]=arr[r]===v?null:v;P.ans[i]=arr;save();renderBody();break;}
    case 'flag':P.flags[P.cur]=!P.flags[P.cur];save();renderBody();break;
    case 'next':P.cur=Math.min(QUIZ[P.subj].q.length-1,P.cur+1);save();renderBody(true);break;
    case 'prev':P.cur=Math.max(0,P.cur-1);save();renderBody(true);break;
    case 'go':if(S.view==='exam'){P.cur=+d.i;navOpen=false;save();renderBody(true);}else{RV.i=+d.i;renderReview();window.scrollTo(0,0);}break;
    case 'navopen':navOpen=true;renderBody();break;
    case 'navclose':navOpen=false;renderBody();break;
    case 'finish':navOpen=false;confirmFinish();break;
    case 'dofinish':finish(false);break;
    case 'review':RV.id=d.id;RV.i=+d.i||0;S.view='review';render();break;
    case 'rnext':RV.i++;render();break;
    case 'rprev':RV.i--;render();break;
    case 'result':{var a2=A.filter(function(x){return x.id===d.id;})[0];if(a2){S.view='result';render2(a2);}break;}
    case 'clear':modal('<h3>Hapus semua riwayat?</h3><p>Seluruh skor percobaan akan dihapus dan tidak bisa dikembalikan.</p><div class="actions"><button class="btn ghost" data-act="mclose">Batal</button><button class="btn danger" data-act="doclear">Hapus semua</button></div>');break;
    case 'doclear':A.slice().forEach(function(x){delAtt(x.id);});mclose();render();break;
  }
});
function renderBody(top){var y=window.scrollY;renderExam();if(!top)window.scrollTo(0,y);else window.scrollTo(0,0);}
window.addEventListener('hashchange',function(){if(S.view==='exam')return;if(location.hash==='#riwayat')S.view='history';else if(location.hash==='#beranda')S.view='home';else return;render();});
document.addEventListener('visibilitychange',tickNow);

if(location.hash==='#riwayat')S.view='history';
if(P&&P.end<=Date.now()&&false){}
render();
initCloud();
</script>
